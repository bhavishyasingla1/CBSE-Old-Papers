<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | CBSE PYQs | Codju</title>
  <link rel="icon" type="image/png" href="assets/codju-logo.png">
  <link rel="stylesheet" href="css/style.css">
  <meta http-equiv="refresh" content="3; url=./">
  <style>
    .notfound-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .notfound-code {
      font-size: 5rem;
      font-weight: 800;
      color: #6366f1;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .notfound-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    .notfound-desc {
      font-size: 1rem;
      color: #64748b;
      max-width: 460px;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .notfound-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #0f172a;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .notfound-btn:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="notfound-container">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">Page not found</h1>
    <p class="notfound-desc">The requested page doesn't exist. You'll be automatically redirected to the CBSE Question Papers study tool in a few seconds...</p>
    <a href="./" class="notfound-btn">
      <span>Go to CBSE PYQs</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
</body>
</html>
